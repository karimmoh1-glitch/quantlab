[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Vectorized tick-to-bar backtester with from-scratch risk analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
media = ["matplotlib>=3.8"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
